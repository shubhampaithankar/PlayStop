services:
  - type: web
    name: playstop-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter "@playstop/api..." build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        sync: false
      - key: REDIS_URL
        sync: false
      - key: HOLD_TTL_SECONDS
        value: 300
      - key: REDIS_COMMAND_TIMEOUT_MS
        value: 500
      - key: APP_ENV
        sync: false
      - key: MOCK_OTP
        # true for the recruiter demo: OTP stays mock and the devCode shows on
        # screen so the booking flow completes end-to-end. Flip to false once a
        # real SMS/email sender is wired (see playstop-otp-messaging).
        value: true
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: 0.1
