services:
  - type: web
    name: playstop-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @playstop/types build && pnpm --filter @playstop/api build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        sync: false
      - key: REDIS_URL
        sync: false
      - key: HOLD_TTL_SECONDS
        value: 300
      - key: REDIS_COMMAND_TIMEOUT_MS
        value: 500
      - key: APP_ENV
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: 0.1
