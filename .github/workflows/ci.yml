name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build in dependency order first: packages/types has no test script, so
      # `pnpm -r run test` never builds its dist and engine's test (tsc) cannot
      # resolve @playstop/types. The build job already does this; the test job must too.
      - run: pnpm build
      - name: Start MongoDB replica set
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: 8.0
          mongodb-replica-set: rs0
      - name: Assert the replica set supports transactions
        run: node scripts/assert-replica-set.mjs
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      - run: pnpm test
        env:
          TEST_PROFILE: ci
          MONGODB_URI: mongodb://127.0.0.1:27017/playstop_test?replicaSet=rs0
          REDIS_URL: redis://127.0.0.1:6379
          MONGODB_DB: playstop_test
          APP_ENV: dev
          # MOCK_OTP now defaults to false (fail closed in prod); the OTP
          # tests mint devCode via mintVerification, so CI opts back in.
          MOCK_OTP: "true"